<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:#f7f7f5;
  color:#222;
}

/* Hero */

.hero{
  height:60vh;
  background:url("https://images.unsplash.com/photo-1460317442991-0ec209397118?w=1600") center/cover no-repeat;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
}

.hero-content{
  position:relative;
  z-index:2;
  text-align:center;
  color:#fff;
}

.hero-content h1{
  font-size:60px;
  font-family:"Cormorant Garamond",serif;
}

.hero-content p{
  margin-top:10px;
  font-size:18px;
}

/* Container */

.container{
  max-width:1300px;
  margin:auto;
  padding:50px 20px;
}

/* Filter */

.filter-box{
  background:#fff;
  padding:12px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  margin-top:-70px;
  position:relative;
  z-index:10;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.filter-grid select{
  width:100%;
  padding:16px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:12px;
  outline:none;
  background:#fff;
}

/* Title */

.section-title{
  text-align:center;
  margin:25px 0 40px;
}

.section-title h2{
  font-size:48px;
  font-family:"Cormorant Garamond",serif;
  color:#111827;
}

/* Property Grid */

.property-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
}

/* Card */

.property-card{
  background:#efefec;
  border-radius:28px;
  /* padding:14px; */
  transition:.35s ease;
}

.property-card:hover{
  transform:translateY(-8px);
}

.property-card img{
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:22px;
}

.property-content{
  padding:18px 20px;
}

.property-content h3{
  font-size:22px;
  font-family:"Cormorant Garamond",serif;
  margin-bottom:12px;
  color:#111827;
}

.location-row{
  display:flex;
  align-items:center;
  gap:8px;
  color:#555;
  margin-bottom:20px;
  font-size:13px;
}

.location-row svg{
  width:18px;
  height:18px;
  fill:#4caf50;
}

.property-actions{
  display:flex;
  gap:12px;
}

.action-btn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 18px;
  border:1px solid #ddd;
  border-radius:40px;
  text-decoration:none;
  color:#111827;
  background:#fff;
  font-weight:600;
  transition:.25s ease;
}

.action-btn:hover{
  background:#111827;
  color:#fff;
}

.action-btn svg{
  width:18px;
  height:18px;
  fill:currentColor;
}

.no-results{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  font-size:18px;
  color:#666;
}

/* Responsive */

@media(max-width:992px){
  .property-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:768px){

  .hero-content h1{
    font-size:42px;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .property-grid{
    grid-template-columns:1fr;
  }

  .section-title h2{
    font-size:38px;
  }

}
</style>

    const areaFilter = document.getElementById("areaFilter");      // Zone dropdown
const locationFilter = document.getElementById("locationFilter"); // Area dropdown
const propertyGrid = document.getElementById("propertyGrid");

function populateAreas(zone){
  locationFilter.innerHTML = '<option value="">Select Area</option>';

  if(zoneAreas[zone]){
    zoneAreas[zone].forEach(a => {
      locationFilter.innerHTML += `<option value="${a}">${a}</option>`;
    });
  }
}

function renderProperties(list){
  propertyGrid.innerHTML = "";

  if(list.length === 0){
    propertyGrid.innerHTML = '<div class="no-results">No properties found.</div>';
    return;
  }

  list.forEach(p => {
    propertyGrid.innerHTML += `
      <div class="property-card">
        <img src="${p.img}" alt="${p.name}">

        <div class="property-content">
          <h3>${p.name}</h3>

          <div class="location-row">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
            </svg>
            ${p.location}, ${p.area} Bangalore
          </div>

          <div class="property-actions">
            <a href="${p.name.toLowerCase().replace(/ /g,'-')}.html" class="action-btn">About
                <svg viewBox="0 0 24 24">
                <path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
              </svg>
              </a>

            <a href="#" class="action-btn">
                <svg viewBox="0 0 24 24">
                <path d="M5 20h14v-2H5m14-9h-4V3H9v6H5l7 7 7-7z"/>
              </svg>
              Brochure</a>
          </div>
        </div>
      </div>
    `;
  });
}

function filterProperties(){
  const zone = areaFilter.value;
  const location = locationFilter.value;

  const filtered = properties.filter(p => {
    const propertyZone = (p.area || "").toLowerCase();
    const selectedZone = (zone || "").toLowerCase();

    return (!zone || propertyZone === selectedZone) &&
           (!location || p.location === location);
  });

  renderProperties(filtered);
}

// Events
areaFilter.addEventListener("change", () => {
  populateAreas(areaFilter.value);
  filterProperties();
});

locationFilter.addEventListener("change", filterProperties);

// Initial load
renderProperties(properties);
