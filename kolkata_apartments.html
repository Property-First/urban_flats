.hero{

.hero p{

}

.container{
  max-width:1200px;

}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:24px;
}

.filter-btn{
  padding:10px 18px;
  border:1px solid #d1d5db;
  border-radius:999px;
  background:#fff;
  color:#374151;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:.25s ease;
}

.filter-btn:hover,
.filter-btn.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

.property-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:18px;
}

.property-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(15,23,42,.06);
  transition:.25s ease;
}

.property-image{
  position:relative;
}

.property-image img{
  width:100%;
  height:200px;
  object-fit:cover;
  display:block;
}

.status{
  position:absolute;
  top:12px;
  left:12px;
  z-index:2;
  padding:6px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.property-card:hover{
  transform:translateY(-3px);
}

.property-card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.property-content{
  padding:16px;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  margin-bottom:10px;
}

.upcoming{ background:#fff4d6; color:#8a6d00; }
.construction{ background:#e8f2ff; color:#0056b3; }
.ready{ background:#e7f8ee; color:#0b7a3d; }

.property-content h3{
  font-family:'Playfair Display', serif;
  font-size:20px;
  margin-top: -5px;
  font-weight:700;
  margin-bottom:2px;
  color:#111827;
}

.location{
  color:#6b7280;
  font-size:13px;
  margin-bottom:10px;
}

.price{
  font-size:18px;
  font-weight:700;
  color:#0f172a;
  margin-bottom:10px;
}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  font-size:13px;
  color:#4b5563;
  margin-bottom:14px;
}

.details strong{
  color:#111827;
  font-weight:600;
}

.btn{
  display:inline-block;
  /* width:100%; */
  text-align:center;
  padding:11px;
  border-radius:10px;
  background:#111827;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  transition:.25s ease;
}

.btn:hover{
  background:#0d6efd;
}

@media (max-width:768px){
  .container{

  .property-grid{

  .property-content{

  .property-content h3{
    font-size:18px;
  }

  .price{
    font-size:17px;

  //   "possession": "2027",
  //   "image": "images/kolkata/siddha-serena.jpg"
  // }
        
    ];

    const grid = document.getElementById('propertyGrid');

    function renderProperties(filter = 'all') {
      grid.innerHTML = '';

      const filtered = filter === 'all'
        ? properties
        : properties.filter(p => p.status === filter);

      filtered.forEach(property => {
        const card = document.createElement('div');
        card.className = 'property-card';

        const statusText = {
          upcoming: 'Upcoming Project',
          construction: 'Under Construction',
          ready: 'Ready to Move'
        };

        card.innerHTML = `
  <div class="property-image">
    <span class="status ${property.status}">${statusText[property.status]}</span>
    <img src="${property.image}" alt="${property.projectName}">
  </div>

  <div class="property-content">
    <h3>${property.projectName}</h3>
    <div class="location">${property.location}</div>
    <div class="price">${property.priceRange}</div>

    <div class="details">
      <div><strong>Configuration</strong><br>${property.bhk}</div>
      <div><strong>Size</strong><br>${property.sizeRange}</div>
      <div><strong>Possession</strong><br>${property.possession}</div>
      <div><strong>Status</strong><br>${statusText[property.status]}</div>
    </div>

    <a href="${property.url}" class="btn">View Details</a>
  </div>
`;

grid.appendChild(card);
      });
    }

    renderProperties();

    document.querySelectorAll('.filter-btn').forEach(button => {
      button.addEventListener('click', () => {

        document.querySelectorAll('.filter-btn')
          .forEach(btn => btn.classList.remove('active'));

        button.classList.add('active');

        renderProperties(button.dataset.filter);
      });
    });
  </script>

</body>
</html>
