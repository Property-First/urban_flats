        header {

        .thankyou-container {
            min-height: 80vh;

        .thankyou-box {
            background-color: #fff;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .thankyou-box h2 {
            font-size: 2.5rem;
            color: #4361ee;
            margin-bottom: 20px;
        }
        .thankyou-box p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .btn-primary, .btn-success {
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 50px;
            text-decoration: none;
        }
        .btn-primary { background-color: #4361ee; color: #fff; }
        .btn-primary:hover { background-color: #3a0ca3; }
        .btn-success { background-color: #4bb543; color: #fff; }
        .btn-success:hover { background-color: #3a9c35; }
        .social-icons {
            margin-top: 30px;
        }
        .social-icons a {
            display: inline-block;
            margin: 0 10px;
            font-size: 1.2rem;
            color: #fff;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
        }
        .facebook { background: #3b5998; }
        .twitter { background: #1da1f2; }
        .linkedin { background: #0077b5; }
        .email { background: #dd4b39; }
        .back-link {
            margin-top: 30px;
        }
        .back-link a {
            text-decoration: none;
            color: #4361ee;
            font-weight: 600;
        }
        .back-link a:hover { color: #3a0ca3; }
